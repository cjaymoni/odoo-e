name: Odoo Catering Module CI/CD

on:
  push:
    branches: [main, odoo-18-catering-app, develop]
  pull_request:
    branches: [main, odoo-18-catering-app]
  workflow_dispatch:

env:
  ODOO_VERSION: "18.0"
  MODULE_NAME: cater
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pylint black isort

      - name: Run Black (code formatter check)
        run: |
          black --check --diff enterprise/cater/

      - name: Run isort (import sorting check)
        run: |
          isort --check-only --diff enterprise/cater/

      - name: Run Flake8 (PEP8 compliance)
        run: |
          flake8 enterprise/cater/ --max-line-length=120 --exclude=__pycache__,*.pyc

      - name: Run Pylint
        run: |
          pylint enterprise/cater/ --disable=C0114,C0115,C0116 --max-line-length=120 || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (security linter)
        run: |
          bandit -r enterprise/cater/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxslt1-dev \
            libldap2-dev libsasl2-dev \
            libssl-dev libpq-dev \
            libjpeg-dev zlib1g-dev \
            node-less npm

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install coverage pytest

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U odoo; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Initialize Odoo Database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
          PGDATABASE: test_db
        run: |
          python3 -m odoo \
            --addons-path=odoo/addons,enterprise \
            --database=test_db \
            --db_host=localhost \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --init=base \
            --stop-after-init \
            --without-demo=False

      - name: Install Cater Module
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
          PGDATABASE: test_db
        run: |
          python3 -m odoo \
            --addons-path=odoo/addons,enterprise \
            --database=test_db \
            --db_host=localhost \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --init=cater \
            --stop-after-init \
            --without-demo=False

      - name: Run Unit Tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
          PGDATABASE: test_db
        run: |
          coverage run --source=enterprise/cater \
            -m odoo \
            --addons-path=odoo/addons,enterprise \
            --database=test_db \
            --db_host=localhost \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --test-enable \
            --test-tags=cater \
            --stop-after-init \
            --log-level=test

      - name: Generate Coverage Report
        run: |
          coverage report -m
          coverage xml
          coverage html

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=80

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: odoo-catering:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose
        run: |
          docker-compose config
          docker-compose up -d
          sleep 30
          docker-compose ps
          docker-compose logs odoo
          docker-compose down

  manifest-validation:
    name: Validate Manifest & Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate __manifest__.py
        run: |
          python3 -c "
          import ast
          with open('enterprise/cater/__manifest__.py', 'r') as f:
              manifest = ast.literal_eval(f.read())

          required_keys = ['name', 'version', 'author', 'category', 'license', 'depends', 'data']
          missing = [k for k in required_keys if k not in manifest]

          if missing:
              print(f'ERROR: Missing required keys in manifest: {missing}')
              exit(1)

          print('✓ Manifest validation passed')
          print(f'Module: {manifest[\"name\"]}')
          print(f'Version: {manifest[\"version\"]}')
          print(f'License: {manifest[\"license\"]}')
          "

      - name: Check Module Structure
        run: |
          required_dirs="models views security controllers data static tests"
          for dir in $required_dirs; do
            if [ -d "enterprise/cater/$dir" ]; then
              echo "✓ Found: enterprise/cater/$dir"
            else
              echo "⚠ Missing: enterprise/cater/$dir"
            fi
          done

      - name: Validate Python Syntax
        run: |
          python3 -m py_compile $(find enterprise/cater -name "*.py")
          echo "✓ All Python files have valid syntax"

      - name: Check for Translation Files
        run: |
          if [ -d "enterprise/cater/i18n" ]; then
            echo "✓ Translation directory exists"
            ls -la enterprise/cater/i18n/
          else
            echo "⚠ No translation directory found"
          fi

      - name: Validate XML Views
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          find enterprise/cater/views -name "*.xml" -exec xmllint --noout {} \;
          echo "✓ All XML files are valid"

  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README
        run: |
          if [ -f "enterprise/cater/README.md" ]; then
            echo "✓ README.md exists"
            wc -l enterprise/cater/README.md
          else
            echo "ERROR: README.md missing"
            exit 1
          fi

      - name: Check LICENSE
        run: |
          if [ -f "enterprise/cater/LICENSE" ]; then
            echo "✓ LICENSE file exists"
          else
            echo "ERROR: LICENSE file missing"
            exit 1
          fi

      - name: Validate Markdown
        uses: actionshub/markdownlint@main
        with:
          path: enterprise/cater/

  release:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build, manifest-validation]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/odoo-18-catering-app'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create module archive
        run: |
          cd enterprise
          zip -r ../cater-${GITHUB_SHA::7}.zip cater/ \
            -x "*.pyc" -x "*__pycache__*" -x "*.git*"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-cater-module
          path: cater-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: cater-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build, manifest-validation]
    if: always()
    steps:
      - name: Send Status Notification
        run: |
          echo "CI/CD Pipeline completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Docker: ${{ needs.docker-build.result }}"
          echo "Manifest: ${{ needs.manifest-validation.result }}"
