services:
  db:
    image: postgres:17.4
    container_name: odoo-enterprise-postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo_password
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/odoo-db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - odoo-network

  odoo:
    build: .
    container_name: odoo-enterprise
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=odoo
      - DB_PASSWORD=odoo_password
      - DB_PORT=5432
    volumes:
      - ./odoo:/opt/odoo/odoo:ro
      - ./enterprise:/mnt/extra-addons
      - ./odoo.conf:/opt/odoo/odoo.conf
      - ./entrypoint.sh:/opt/odoo/entrypoint.sh
      - ./wait-for-psql.py:/opt/odoo/wait-for-psql.py
      - ./volumes/odoo-web-data:/var/lib/odoo
    ports:
      - "8069:8069"
    restart: unless-stopped
    networks:
      - odoo-network
  nginx:
    image: nginx:latest
    container_name: odoo-enterprise-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - odoo
    restart: unless-stopped
    networks:
      - odoo-network

  certbot:
    image: certbot/certbot
    container_name: odoo-enterprise-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - odoo-network

networks:
  odoo-network:
    driver: bridge
